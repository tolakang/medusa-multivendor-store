# =============================================================================
# Medusa Server — API + Admin + Scheduled Jobs
# Deploy AFTER infrastructure services are running
# =============================================================================

services:
  medusa-server:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.server
    restart: unless-stopped
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa_secret}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-medusa_store}
      REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      MEILISEARCH_HOST: http://${MEILISEARCH_HOST:-meilisearch}:${MEILISEARCH_PORT:-7700}
      MEILISEARCH_ADMIN_KEY: ${MEILISEARCH_ADMIN_KEY:-change_me_master_key}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwt123}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecretcookie123}
      MEDUSA_WORKER_MODE: server
      MEDUSA_DISABLE_ADMIN: "false"
      BACKEND_URL: ${BACKEND_URL:-http://localhost:9000}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:8000,http://localhost:9000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
