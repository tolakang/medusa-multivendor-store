# =============================================================================
# Next.js Storefront — Deploy AFTER server is running
# =============================================================================

services:
  medusa-storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
        NPM_TOKEN: ${NPM_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${STOREFRONT_PORT:-8000}:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
