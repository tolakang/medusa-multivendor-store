# =============================================================================
# Next.js Storefront — Deploy AFTER server is running
# =============================================================================

services:
  medusa-storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${STOREFRONT_PORT:-8000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      STORE_NAME: ${STORE_NAME:-Medusa Multi-Vendor Store}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=0", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
