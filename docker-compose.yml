# =============================================================================
# Medusa 2.0 Multi-Vendor E-Commerce — Docker Compose for Dokploy
# Based on rpuls/medusajs-2.0-for-railway-boilerplate patterns
# =============================================================================

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-medusa_store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Meilisearch ----
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_ADMIN_KEY:-change_me_master_key}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Medusa Server (API + Admin + Scheduled Jobs) ----
  medusa-server:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa_secret}@postgres:5432/${POSTGRES_DB:-medusa_store}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_ADMIN_KEY: ${MEILISEARCH_ADMIN_KEY:-change_me_master_key}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwt123}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecretcookie123}
      MEDUSA_WORKER_MODE: server
      MEDUSA_DISABLE_ADMIN: "false"
      BACKEND_URL: ${BACKEND_URL:-http://localhost:9000}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:8000,http://localhost:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ---- Medusa Worker (Background Jobs Only) ----
  medusa-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa_secret}@postgres:5432/${POSTGRES_DB:-medusa_store}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_ADMIN_KEY: ${MEILISEARCH_ADMIN_KEY:-change_me_master_key}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwt123}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecretcookie123}
      MEDUSA_WORKER_MODE: worker
      MEDUSA_DISABLE_ADMIN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "medusa"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ---- Next.js Storefront ----
  medusa-storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
    restart: unless-stopped
    ports:
      - "${STOREFRONT_PORT:-8000}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      medusa-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
