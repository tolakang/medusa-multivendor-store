services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_DB: ${POSTGRES_DB:-medusa-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa-secret-pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-medusa-store}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medusa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: medusa-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meilisearch/data
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-your-meilisearch-master-key-change-me}
      MEILI_ENV: production
    networks:
      - medusa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  medusa-server:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: medusa-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa-secret-pw}@postgres:5432/${POSTGRES_DB:-medusa-store}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-me}
      COOKIE_SECRET: ${COOKIE_SECRET:-your-super-secret-cookie-key-change-me}
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:8000,http://localhost:9000}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-your-meilisearch-master-key-change-me}
      PORT: "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - medusa-net

  medusa-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: medusa-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa-secret-pw}@postgres:5432/${POSTGRES_DB:-medusa-store}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-me}
      COOKIE_SECRET: ${COOKIE_SECRET:-your-super-secret-cookie-key-change-me}
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:8000,http://localhost:9000}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-your-meilisearch-master-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      medusa-server:
        condition: service_started
    networks:
      - medusa-net
    command: npm run start:worker

  medusa-storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: medusa-storefront
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://medusa-server:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-pk_123}
    depends_on:
      - medusa-server
    networks:
      - medusa-net

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  medusa-net:
    driver: bridge
